[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geltre-sdk"
version = "0.1.0"
description = "Official Python client SDK for Geltre by Nichols AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nichols AI"}]
keywords = ["geltre", "nichols-ai", "orienting-model", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://nicholsai.com/#geltre"
Documentation = "https://docs.nicholsai.com/introduction/"
Repository = "https://github.com/Shawn5cents/geltre-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
